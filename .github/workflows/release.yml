name: Stable release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: arm64
            goarch: arm64
          - asset: amd64
            goarch: amd64
          - asset: armv7
            goarch: arm
            goarm: '7'
          - asset: mipsle
            goarch: mipsle
            gomips: softfloat
          - asset: mips
            goarch: mips
            gomips: softfloat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
          ASSET_ARCH: ${{ matrix.asset }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: meowdeck-${{ matrix.asset }}
          path: |
            dist/meowdeck-linux-${{ matrix.asset }}.tar.gz
            dist/meowdeck-linux-${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
