name: Bug report
description: Report a reproducible MeowDeck problem
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: How can we reproduce it?
    validations:
      required: true
  - type: input
    attributes:
      label: Router model and OpenWrt version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs

